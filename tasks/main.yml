---
- name: "create dirs"
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ imagemagick_install_path }}"
  tags: imagemagick

- name: "find latest patch version"
  uri:
    url: "{{ imagemagick_releases_url }}"
    return_content: yes
  register: imagemagick_releases_page
  # Uri module doesn't support check mode, but this task is required to determine the latest patch version of ImageMagick to install.
  check_mode: false
  tags: imagemagick

- name: "set vars: IM patch version"
  set_fact:
    imagemagick_patch_version: "{{ imagemagick_releases_page.content | regex_findall('ImageMagick-'+imagemagick_version+'-[0-9]{1,3}.tar.xz') | last | regex_replace('^.*-(.*)\\.tar\\.xz','\\1') }}"
  tags: imagemagick

- name: "set vars: IM filename"
  set_fact:
    imagemagick_file: "ImageMagick-{{ imagemagick_version + '-' + imagemagick_patch_version }}"
  tags: imagemagick

- name: "get source"
  get_url:
    url: "{{ imagemagick_releases_url }}/{{ imagemagick_file }}.tar.xz"
    dest: "/usr/local/src/{{ imagemagick_file }}.tar.xz"
  tags: imagemagick

- name: "check source archive exists"
  stat:
    path: "/usr/local/src/{{ imagemagick_file }}.tar.xz"
  register: imagemagick_source_tar
  tags: imagemagick

- name: "install dependencies"
  apt:
    name: "{{ imagemagick_dependencies + imagemagick_optional_dependencies }}"
    state: present
    update_cache: yes
    cache_valid_time: "{{ apt_cache_valid_time }}"
  retries: "{{ remote_package_retries }}"
  register: apt_result
  until: apt_result is succeeded
  tags: imagemagick

- name: "extract archive"
  unarchive:
    src: "/usr/local/src/{{ imagemagick_file }}.tar.xz"
    dest: "/usr/local/src/"
    copy: no
    creates: "{{ imagemagick_source_path }}/{{ imagemagick_file }}"
  when: not ansible_check_mode or imagemagick_source_tar.stat.exists
  tags: imagemagick

- name: "configure"
  command: "./configure --prefix={{ imagemagick_install_path }} {{ imagemagick_configure_options }}"
  args:
    chdir: "{{ imagemagick_source_path }}/{{ imagemagick_file }}"
    creates: "{{ imagemagick_source_path }}/{{ imagemagick_file }}/config.status"
  when: not ansible_check_mode or imagemagick_source_tar.stat.exists
  tags: imagemagick

- name: "build"
  command: "make -j{{ ansible_processor_cores|default(1) }}"
  args:
    chdir: "{{ imagemagick_source_path }}/{{ imagemagick_file }}"
    creates: "{{ imagemagick_source_path }}/{{ imagemagick_file }}/utilities/.libs"
  when: not ansible_check_mode or imagemagick_source_tar.stat.exists
  tags: imagemagick

- name: "check installed version"
  command: "{{ imagemagick_install_path }}/bin/magick --version"
  register: imagemagick_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  tags: imagemagick

- name: "install ImageMagick would be required"
  debug:
    msg: "ImageMagick would be installed or upgraded"
  changed_when: true
  when: >
    ansible_check_mode and (
      imagemagick_installed_version.rc != 0 or
      imagemagick_version + '-' + imagemagick_patch_version not in imagemagick_installed_version.stdout
    )
  tags: imagemagick

- name: "install"
  command: "make install"
  args:
    chdir: "{{ imagemagick_source_path }}/{{ imagemagick_file }}"
  when: >
    not ansible_check_mode and (
      imagemagick_installed_version.rc != 0 or
      imagemagick_version + '-' + imagemagick_patch_version not in imagemagick_installed_version.stdout
    )
  tags: imagemagick

- name: "get binaries"
  find:
    file_type: any
    paths: "{{ imagemagick_install_path }}/bin/"
    patterns: "^[a-z]+"
    use_regex: yes
  register: imagemagick_binaries
  tags: imagemagick

- name: "add binaries to /usr/bin"
  alternatives:
    name: "{{ item.path | basename }}"
    path: "{{ item.path }}"
    link: "/usr/bin/{{ item.path | basename }}"
  with_items: "{{ imagemagick_binaries.files }}"
  tags: imagemagick
